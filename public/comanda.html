<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Comanda · Bravio Food House</title>
<link rel="icon" href="img/logo.jpg">
<style>
:root{--ink:#111;--muted:#555;--ok:#1F8A4C;--bad:#C62828;--bg:#E9E5DF;--paper:#fff;--w:80mm}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
.bar{position:sticky;top:0;z-index:2;background:#1A1512;color:#fff;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}
.selo{font-weight:800;padding:6px 12px;border-radius:999px;font-size:14px}
.selo.ok{background:var(--ok)}.selo.bad{background:var(--bad)}.selo.wait{background:#555}
.bar button{border:0;border-radius:10px;padding:10px 16px;font-weight:800;font-size:15px;cursor:pointer;background:#F2A81D;color:#1A1206}
.bar button.sec{background:#333;color:#fff}
.wrap{padding:20px 16px 40px;display:flex;justify-content:center}
.ticket{-webkit-print-color-adjust:exact;print-color-adjust:exact;width:var(--w);max-width:100%;background:var(--paper);padding:5mm 4mm;box-shadow:0 6px 24px rgba(0,0,0,.18);font-family:"Courier New",ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.3;color:#000}
.w58 .ticket{font-size:11.5px}
.c{text-align:center}
.big{font-size:2em;font-weight:900;letter-spacing:.02em;line-height:1.05}
.nome{font-weight:900;font-size:1.25em;letter-spacing:.06em}
hr{border:0;border-top:1px dashed #000;margin:7px 0}
hr.solid{border-top:2px solid #000}
.row{display:flex;justify-content:space-between;gap:8px}
.it{margin:6px 0}
.it .q{font-weight:900;font-size:1.15em}
.it .op{padding-left:3ch}
.it .ob{padding-left:3ch;font-weight:900}
.tot{font-weight:900;font-size:1.3em}
.box{border:2px solid #000;padding:5px;margin:6px 0;text-align:center;font-weight:900;font-size:1.1em}
.inv{background:#000;color:#fff;padding:4px;text-align:center;font-weight:900;font-size:1.1em}
.alerta{max-width:80mm;margin:0 auto 12px;background:var(--bad);color:#fff;padding:12px;border-radius:10px;font-weight:700;text-align:center}
.vazio{padding:40px 16px;text-align:center;color:var(--muted)}
.small{font-size:.85em}
@media print{
  @page{size:var(--w) auto;margin:0}
  body{background:#fff}
  .bar,.alerta{display:none!important}
  .wrap{padding:0;display:block}
  .ticket{box-shadow:none;width:100%;padding:2mm 3mm}
}
</style>
</head>
<body>
<div class="bar">
  <span class="selo wait" id="selo">Verificando…</span>
  <button type="button" id="imprimir">Imprimir comanda</button>
  <button type="button" class="sec" id="largura">Papel: 80 mm</button>
</div>
<div class="wrap" style="flex-direction:column;align-items:center">
  <div class="alerta" id="alerta" hidden></div>
  <div class="ticket" id="ticket"><div class="vazio">Carregando pedido…</div></div>
</div>
<script>
(function(){
  const $ = s => document.querySelector(s);
  const brl = v => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const token = location.hash.slice(1);

  // largura do papel (58 ou 80 mm), lembrada neste aparelho
  let w = "80"; try { w = localStorage.getItem("bravio_papel") || "80"; } catch (e) {}
  function aplica() { document.documentElement.style.setProperty("--w", w + "mm"); document.body.classList.toggle("w58", w === "58"); $("#largura").textContent = "Papel: " + w + " mm"; }
  $("#largura").onclick = () => { w = w === "80" ? "58" : "80"; try { localStorage.setItem("bravio_papel", w); } catch (e) {} aplica(); };
  aplica();
  $("#imprimir").onclick = () => window.print();

  if (!token) { $("#ticket").innerHTML = '<div class="vazio">Link de comanda inválido.</div>'; $("#selo").textContent = "Sem pedido"; return; }

  fetch("/api/verificar", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token }) })
    .then(r => r.json()).then(r => {
      if (!r.pedido) throw new Error("ilegivel");
      const sel = $("#selo");
      if (r.valido) { sel.className = "selo ok"; sel.textContent = "✔ Pedido autêntico · cód. " + r.codigo; }
      else {
        sel.className = "selo bad"; sel.textContent = "✖ PEDIDO ALTERADO";
        const a = $("#alerta"); a.hidden = false;
        a.textContent = "Atenção: este link foi modificado depois de gerado pelo site. Não prepare nem entregue sem confirmar com o cliente.";
      }
      render(r.pedido, r.valido, r.codigo);
    }).catch(() => {
      $("#selo").className = "selo bad"; $("#selo").textContent = "✖ PEDIDO ALTERADO OU INVÁLIDO";
      const a = $("#alerta"); a.hidden = false;
      a.textContent = "Este link não foi gerado pelo site ou foi modificado. Não prepare o pedido sem confirmar com o cliente.";
      $("#ticket").innerHTML = '<div class="vazio">Comanda inválida.</div>';
    });

  function render(p, valido, codigo) {
    const dt = new Date(p.t);
    const data = dt.toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
    const hora = dt.toLocaleTimeString("pt-BR", { timeZone: "America/Sao_Paulo", hour: "2-digit", minute: "2-digit" });
    const pago = p.pg.m === "online";
    const nItens = p.i.reduce((s, i) => s + i[0], 0);
    document.title = "Comanda " + p.p;
    $("#ticket").innerHTML = `
      <div class="c nome">BRAVIO FOOD HOUSE</div>
      <div class="c small">DELIVERY · PEDIDO PELO SITE</div>
      <hr class="solid">
      <div class="c">PEDIDO</div>
      <div class="c big">${esc(p.p.slice(-6))}</div>
      <div class="c small">${esc(p.p)}</div>
      <div class="row"><span>${data}</span><span>${hora}</span></div>
      ${valido ? "" : '<div class="inv">*** ALTERADO - NÃO VÁLIDO ***</div>'}
      <hr class="solid">
      ${p.i.map(i => `<div class="it">
        <div class="row"><span class="q">${i[0]}x ${esc(i[1]).toUpperCase()}</span><span>${brl(i[3])}</span></div>
        ${i[4].map(o => `<div class="op">- ${esc(o)}</div>`).join("")}
        ${i[5] ? `<div class="ob">&gt;&gt; OBS: ${esc(i[5])}</div>` : ""}
      </div>`).join("<hr>")}
      <hr class="solid">
      <div class="row"><span>Itens (${nItens})</span><span>${brl(p.s)}</span></div>
      <div class="row"><span>Entrega (${String(p.km).replace(".", ",")} km)</span><span>${p.f ? brl(p.f) : "GRÁTIS"}</span></div>
      <div class="row tot"><span>TOTAL</span><span>${brl(p.tot)}</span></div>
      ${pago
        ? `<div class="inv">PAGO ONLINE · ${esc(p.pg.d).toUpperCase()}</div><div class="c small">Mercado Pago nº ${esc(p.pg.id)}</div><div class="box">NÃO COBRAR NA ENTREGA</div>`
        : `<div class="box">COBRAR NA ENTREGA<br>${esc(p.pg.d).toUpperCase()} · ${brl(p.tot)}${p.pg.d === "Dinheiro" ? (p.pg.troco ? `<br>CLIENTE PAGA COM ${brl(p.pg.troco)}<br>LEVAR TROCO DE ${brl(p.pg.troco - p.tot)}` : "<br>SEM TROCO") : ""}${/Cartão/.test(p.pg.d) ? "<br>LEVAR MAQUININHA" : ""}</div>`}
      ${p.o ? `<hr><div><b>OBS DO PEDIDO:</b> ${esc(p.o)}</div>` : ""}
      <hr class="solid">
      <div><b>CLIENTE:</b> ${esc(p.c.n)}</div>
      <div><b>TEL:</b> ${esc(p.c.f)}</div>
      <div><b>END:</b> ${esc(p.c.e)}</div>
      <div><b>BAIRRO:</b> ${esc(p.c.b)}${p.c.cep ? " · CEP " + esc(p.c.cep) : ""}</div>
      ${p.c.r ? `<div><b>REF:</b> ${esc(p.c.r)}</div>` : ""}
      <hr>
      <div class="c small">Verificação: ${esc(codigo)}${valido ? " ✔" : " ✖"}</div>
      <div class="c small">Obrigado pela preferência!</div>`;
  }
})();
</script>
</body>
</html>
